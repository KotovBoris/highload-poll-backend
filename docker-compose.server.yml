# ===== highload-poll-backend: запуск на Linux-стенде (cl1) =====
#
# Отличия от локального docker-compose.yml:
#  - образы сервисов собираются на ноуте под linux/amd64 и берутся из ./bin
#    (Dockerfile.server копирует готовые бинарники, без golang-этапа);
#  - порты сдвинуты (18080/18081/18082), чтобы не конфликтовать с чужими
#    контейнерами на стенде;
#  - pprof выключен по умолчанию (включай через PPROF_ADDR при отладке).
#
# Запуск: sudo docker compose -f docker-compose.server.yml -p hp up -d

name: hp

services:
  postgres:
    image: postgres:16-alpine
    # Дефолтный seccomp-профиль Docker 24 на ядре 6.1 блокирует syscalls
    # postgres ("Operation not permitted" при initdb). На стенде снимаем.
    security_opt:
      - seccomp=unconfined
    environment:
      POSTGRES_USER: poll
      POSTGRES_DB: poll
      POSTGRES_HOST_AUTH_METHOD: trust
    # Данные в tmpfs: на стенде named volume не даёт писать (Operation not
    # permitted на этой ФС), а для нагрузочного теста персистентность не нужна.
    tmpfs:
      - /var/lib/postgresql/data:size=2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poll -d poll"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.8.0
    security_opt:
      - seccomp=unconfined
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_MS: 300000
      CLUSTER_ID: "highload-poll-kraft-01"
      # Под нагрузкой Kafka пишет много; даём ей больше памяти кучи.
      KAFKA_HEAP_OPTS: "-Xmx2g -Xms1g"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  results:
    image: hp-results
    security_opt:
      - seccomp=unconfined
    entrypoint: ["/app/bin/results"]
    environment:
      HTTP_ADDR: ":8081"
      DATABASE_URL: "postgres://poll@postgres:5432/poll?sslmode=disable"
      MIGRATIONS_DIR: "/app/migrations"
      DB_MAX_CONNS: "20"
    volumes:
      - ./migrations:/app/migrations:ro
    ports:
      - "18081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  api:
    image: hp-api
    security_opt:
      - seccomp=unconfined
    entrypoint: ["/app/bin/api"]
    environment:
      HTTP_ADDR: ":8080"
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_TOPIC: "votes"
      RESULTS_URL: "http://results:8081"
      VOTE_BATCH_SIZE: "10000"
      POLL_CACHE_TTL: "1m"
      CLOSE_CHECK_INTERVAL: "500ms"
      COOKIE_SECRET: "dev-cookie-secret-change-me"
      MAX_ISSUED_ENTRIES: "1000000"
      MAX_COOKIES_PER_CLIENT: "1000"
      DISABLE_ISSUE_LIMIT: "false"
      PPROF_ADDR: ":6060"
      # Реже запускать GC: под нагрузкой видно заметную долю в madvise/span scan.
      # Меняем порог с дефолтных 100% до 400% — обмен памяти на пропускную способность.
      GOGC: "400"
    ports:
      - "18080:8080"
    depends_on:
      kafka:
        condition: service_healthy
      results:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  api2:
    image: hp-api
    security_opt:
      - seccomp=unconfined
    entrypoint: ["/app/bin/api"]
    environment:
      HTTP_ADDR: ":8080"
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_TOPIC: "votes"
      RESULTS_URL: "http://results:8081"
      VOTE_BATCH_SIZE: "10000"
      POLL_CACHE_TTL: "1m"
      CLOSE_CHECK_INTERVAL: "500ms"
      COOKIE_SECRET: "dev-cookie-secret-change-me"
      MAX_ISSUED_ENTRIES: "1000000"
      MAX_COOKIES_PER_CLIENT: "1000"
      DISABLE_ISSUE_LIMIT: "false"
      GOGC: "400"
    ports:
      - "18083:8080"
    depends_on:
      kafka:
        condition: service_healthy
      results:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  consumer:
    image: hp-consumer
    security_opt:
      - seccomp=unconfined
    entrypoint: ["/app/bin/consumer"]
    environment:
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_TOPIC: "votes"
      KAFKA_GROUP_ID: "poll-consumers"
      RESULTS_URL: "http://results:8081"
      HTTP_ADDR: ":8082"
      CLOSE_GRACE: "1s"
      CLOSE_HARD_TIMEOUT: "1m"
      COMMIT_DONE_PERCENT: "90"
      COMMIT_STALE_MESSAGES: "1000"
    depends_on:
      kafka:
        condition: service_healthy
      results:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
